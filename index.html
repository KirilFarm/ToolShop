<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RabbitBoost</title>
    <!-- Telegram Web App JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Заголовок с подстановкой имени -->
        <h1 class="greeting">Удачи в продажах, <span id="userName">Андрей</span></h1>

        <!-- Главная карточка с тарифами -->
        <div class="glass-card">
            <div class="card-header">
                <div class="icon-box">
                    <svg width="14" height="18" viewBox="0 0 14 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.5 7.5H8.25L9.75 0.75C9.8 0.45 9.6 0.15 9.3 0.05C9 -0.05 8.7 0.05 8.55 0.3L0.3 10.05C0.15 10.2 0.1 10.4 0.2 10.6C0.3 10.8 0.5 10.95 0.75 10.95H6L4.5 17.7C4.45 18 4.65 18.3 4.95 18.4C5.25 18.5 5.55 18.4 5.7 18.15L13.95 8.4C14.1 8.25 14.15 8.05 14.05 7.85C13.95 7.65 13.75 7.5 13.5 7.5Z" fill="white"/>
                    </svg>
                </div>
                <div class="card-title">Доступные бусты</div>
            </div>

            <div class="plan">
                <div class="plan-title">1 месяц</div>
                <div class="plan-price-box">
                    <div class="plan-price">9.90 ₽</div>
                    <div class="plan-status">Нет в наличии</div>
                </div>
            </div>

            <div class="plan">
                <div class="plan-title">3 месяца</div>
                <div class="plan-price-box">
                    <div class="plan-price">49.00 ₽</div>
                    <div class="plan-status">Нет в наличии</div>
                </div>
            </div>

            <button class="buy-btn" id="buyButton">Купить</button>

            <div class="balance-section">
                <div>
                    <div class="balance-label">БАЛАНС</div>
                    <div class="balance-amount">59.07 ₽</div>
                </div>
                <button class="add-btn">+</button>
            </div>
        </div>

        <!-- Горизонтальная карусель -->
        <div class="carousel-wrapper">
            <div class="carousel-track" id="carouselTrack">
                
                <!-- Карточка 1: История заказов -->
                <div class="action-card">
                    <div class="action-img img-history"></div>
                    <div class="action-info">
                        <h3>История заказов</h3>
                        <p>Все заказы и<br>пополнения</p>
                    </div>
                </div>

                <!-- Карточка 2: Кастомизация -->
                <div class="action-card">
                    <div class="action-img img-customization"></div>
                    <div class="action-info">
                        <h3>Кастомизация</h3>
                        <p>Как выглядят бустеры<br>на твоём сервере</p>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Точки пагинации (2 точки для 2 карточек) -->
        <div class="pagination" id="paginationDots">
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <!-- Карточка Discord -->
        <div class="discord-card">
            <div class="discord-info">
                <h3>Заходи в наш</h3>
                <div class="discord-logo">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    Discord-сервер
                </div>
            </div>
            <div class="discord-img img-discord-pig"></div>
        </div>
    </div>

    <!-- Нижнее навигационное меню -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM7 10.82C5.84 10.4 5 9.3 5 8V7h2v3.82zM19 8c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </a>
    </nav>

    <!-- Подключение скриптов -->
    <script src="script.js"></script>
</body>
</html>
